<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Memorize - Ebbinghaus & AI Assistant</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151e2e;
      --card-inner: #0b111e;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #26334d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    .navbar { background: #0b111e; border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    .navbar h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
    .navbar .stats-pill { background: #151e2e; border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #a5f3fc; }

    .container { flex: 1; padding: 14px; max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }

    /* 5-Column Navigation */
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 14px; background: #0b111e; padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .tab-btn { background: none; border: none; padding: 8px 2px; color: var(--text-dim); font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--primary); color: white; }

    .view-section { display: none; flex-direction: column; flex: 1; }
    .view-section.active { display: flex; }

    /* Review Card */
    .quiz-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 18px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; min-height: 380px; }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .mode-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .streak-badge { font-size: 12px; color: #fbbf24; font-weight: bold; }
    
    .question-box { margin: 16px 0; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
    .q-main { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px; line-height: 1.3; word-break: break-word; }
    .q-sub { font-size: 13px; color: var(--accent); font-family: monospace; }
    .q-sentence { font-size: 15px; color: #e2e8f0; line-height: 1.5; background: var(--card-inner); padding: 12px; border-radius: 10px; border: 1px dashed var(--border); margin-top: 10px; text-align: left; }

    .audio-group { display: flex; gap: 8px; justify-content: center; margin: 10px auto; flex-wrap: wrap; }
    .btn-audio { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .btn-audio-user { background: #8b5cf6; }

    .answer-box { background: var(--card-inner); border-radius: 12px; padding: 14px; margin: 14px 0; text-align: left; border: 1px solid var(--border); display: none; }
    .ans-title { font-size: 18px; font-weight: 700; color: #38bdf8; }
    .ans-ipa { font-size: 13px; color: #a5f3fc; font-family: monospace; margin: 2px 0 6px 0; }
    .ans-meaning { font-size: 14px; color: #cbd5e1; margin-bottom: 6px; }
    .ans-sentence { font-size: 13px; color: #94a3b8; font-style: italic; border-top: 1px dashed var(--border); padding-top: 6px; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .btn { border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-reveal { background: var(--primary); color: white; width: 100%; }
    .btn-fail { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    /* Forms */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: 600; }
    .form-control { width: 100%; background: var(--card-inner); border: 1px solid var(--border); padding: 10px; border-radius: 10px; color: #fff; font-size: 14px; }
    .form-control:focus { outline: none; border-color: var(--primary); }
    textarea.form-control { resize: vertical; min-height: 70px; }
    .btn-submit { background: var(--primary); color: white; width: 100%; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }

    .input-with-btn { display: flex; gap: 8px; }
    .btn-inline-action { background: #0284c7; border: none; color: #fff; font-size: 11px; padding: 0 10px; border-radius: 10px; font-weight: bold; cursor: pointer; white-space: nowrap; }

    .recorder-box { background: var(--card-inner); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-top: 6px; display: flex; align-items: center; justify-content: space-between; }
    .record-btn { background: #ef4444; color: white; border: none; padding: 7px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .record-btn.recording { animation: pulse 1s infinite; background: #dc2626; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Sub-tabs */
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 12px; background: var(--card-inner); padding: 4px; border-radius: 10px; }
    .sub-tab-btn { flex: 1; background: none; border: none; padding: 7px; font-size: 12px; color: var(--text-dim); border-radius: 8px; cursor: pointer; font-weight: bold; }
    .sub-tab-btn.active { background: #334155; color: var(--accent); }

    .score-badge-box { text-align: center; margin: 12px 0; padding: 12px; background: var(--card-inner); border-radius: 12px; border: 1px solid var(--border); }
    .score-number { font-size: 32px; font-weight: 900; color: #34d399; }
    .diff-display { font-size: 15px; line-height: 1.8; text-align: left; padding: 10px; background: var(--card-inner); border-radius: 10px; margin-top: 10px; word-break: break-word; }
    .diff-word-correct { color: #34d399; font-weight: bold; }
    .diff-word-wrong { color: #f87171; text-decoration: line-through; margin-right: 4px; }
    .diff-word-missing { color: #fbbf24; font-weight: bold; text-decoration: underline; }

    /* AI Tutor Card & Messages */
    .ai-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .ai-chat-output { background: var(--card-inner); border: 1px solid var(--border); border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.7; max-height: 340px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    .card-preview-box { background: rgba(56, 189, 248, 0.08); border: 1px dashed var(--accent); border-radius: 10px; padding: 12px; margin-top: 10px; text-align: left; }
    .card-preview-title { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 6px; }

    /* Card List */
    .card-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: calc(100vh - 220px); }
    .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .item-word { font-size: 15px; font-weight: bold; color: #fff; }
    .item-ipa { font-size: 12px; color: var(--accent); font-family: monospace; }
    .item-meaning { font-size: 13px; color: var(--text-dim); }
    .item-actions { display: flex; gap: 6px; justify-content: flex-end; border-top: 1px dashed #1e293b; padding-top: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
    .btn-small { background: #334155; color: #cbd5e1; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .btn-small:hover { color: #fff; }
    
    .item-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .badge-master { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-learning { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>🧠 Memorize</h1>
    <div class="stats-pill" id="nav-due-counter">待复习: 0</div>
  </div>

  <div class="container">
    <!-- 5 Top Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('review')">📖 复习</button>
      <button class="tab-btn" onclick="switchTab('train')">🎯 训练</button>
      <button class="tab-btn" onclick="switchTab('add')">➕ 录入</button>
      <button class="tab-btn" onclick="switchTab('ai')">🤖 AI 助教</button>
      <button class="tab-btn" onclick="switchTab('list')">📚 词库</button>
    </div>

    <!-- 1. REVIEW VIEW -->
    <div id="view-review" class="view-section active">
      <!-- 核心复习卡片 -->
      <div class="quiz-card" id="quiz-card-box">
        <div>
          <div class="quiz-header">
            <span class="mode-badge" id="q-mode-label">题型准备中</span>
            <span class="streak-badge" id="q-streak-label">连胜: 🔥 0</span>
          </div>

          <div class="question-box">
            <div class="q-main" id="q-main-text">准备中...</div>
            <div class="q-sub" id="q-sub-text"></div>
            
            <div class="audio-group">
              <button class="btn-audio" id="btn-audio-sys" onclick="playCurrentAudio()">🔊 示范朗读</button>
              <button class="btn-audio btn-audio-user" id="btn-audio-user" style="display:none;" onclick="playUserAudio()">🎙️ 我的原声</button>
            </div>

            <div class="q-sentence" id="q-sentence-box" style="display: none;"></div>
          </div>

          <div class="answer-box" id="answer-box">
            <div class="ans-title" id="ans-title">Word</div>
            <div class="ans-ipa" id="ans-ipa">/ipa/</div>
            <div class="ans-meaning" id="ans-meaning">中文解释</div>
            <div class="ans-sentence" id="ans-sentence">例句展示</div>
          </div>
        </div>

        <div>
          <button class="btn btn-reveal" id="btn-reveal" onclick="revealAnswer()">👀 显示答案 / 查看释义</button>
          <div class="actions" id="action-btns" style="display: none;">
            <button class="btn btn-fail" onclick="handleResult(false)">❌ 记错了 (重置)</button>
            <button class="btn btn-success" onclick="handleResult(true)">✅ 记对了 (升级)</button>
          </div>
        </div>
      </div>

      <!-- 📰 今日科技精选短讯 (位于卡片下方，防被清空) -->
      <div style="margin-top: 18px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h3 style="color: var(--accent); font-size: 14px;">📰 今日科技精选短讯</h3>
          <button onclick="loadDailyNews()" style="background: none; border: none; color: var(--text-dim); font-size: 11px; cursor: pointer;">🔄 刷新短讯</button>
        </div>
        <div id="news-container">
          <div style="font-size: 12px; color: var(--text-dim); text-align: center; padding: 12px;">正在加载今日短讯...</div>
        </div>
      </div>
    </div>

    <!-- 2. TRAINING VIEW (跟读打分 & 听写) -->
    <div id="view-train" class="view-section">
      <div style="background: var(--card-bg); padding: 16px; border-radius: 16px; border: 1px solid var(--border);">
        <div class="sub-tabs">
          <button class="sub-tab-btn active" id="subtab-btn-shadow" onclick="switchTrainMode('shadow')">🗣️ 口语跟读打分</button>
          <button class="sub-tab-btn" id="subtab-btn-dict" onclick="switchTrainMode('dict')">🎧 听写练习检测</button>
        </div>

        <div class="form-group">
          <label>目标跟读/听写文本 (支持单词、例句或从短讯/作文一键导入):</label>
          <textarea id="train-target-text" class="form-control" style="min-height: 80px;" placeholder="在此输入或从外部一键导入内容..."></textarea>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 14px;">
          <button class="btn-audio" onclick="playAudioStream(document.getElementById('train-target-text').value, 1.0)">🔊 原速播放 (1.0x)</button>
          <button class="btn-audio" style="background: #0369a1;" onclick="playAudioStream(document.getElementById('train-target-text').value, 0.8)">🐢 慢速播放 (0.8x)</button>
        </div>

        <!-- Mode A: 跟读打分 -->
        <div id="train-mode-shadow">
          <button id="btn-start-shadow" class="btn-submit" style="background:#8b5cf6;" onclick="toggleShadowRecognition()">🎙️ 点击开始跟读识别</button>
          <div id="shadow-status" style="font-size:12px; color:var(--text-dim); margin-top:6px; text-align:center;">等待录音...</div>

          <div id="shadow-result-panel" style="display: none;">
            <div class="score-badge-box">
              <div style="font-size: 12px; color: var(--text-dim);">跟读匹配得分</div>
              <div class="score-number" id="shadow-score-num">0</div>
              <div style="font-size: 12px;" id="shadow-score-desc">待测试</div>
            </div>
            <div style="font-size: 12px; color: var(--text-dim); margin-top: 8px;">逐词比对反馈 (🟢准 🔴错/漏):</div>
            <div class="diff-display" id="shadow-diff-box"></div>
          </div>
        </div>

        <!-- Mode B: 听写检测 -->
        <div id="train-mode-dict" style="display: none;">
          <div class="form-group">
            <label>听写输入框 (请盲听音频输入单词或句子):</label>
            <textarea id="dictation-user-input" class="form-control" style="min-height: 90px;" placeholder="听音频后，在此敲入你听到的内容..."></textarea>
          </div>
          <button class="btn-submit" style="background:#059669;" onclick="gradeDictation()">✍️ 提交听写比对</button>

          <div id="dict-result-panel" style="display: none;">
            <div class="score-badge-box">
              <div style="font-size: 12px; color: var(--text-dim);">听写正确率</div>
              <div class="score-number" id="dict-score-num">0%</div>
            </div>
            <div style="font-size: 12px; color: var(--text-dim); margin-top: 8px;">听写逐词核对反馈:</div>
            <div class="diff-display" id="dict-diff-box"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- 3. ADD / EDIT VIEW -->
    <div id="view-add" class="view-section">
      <div style="background: var(--card-bg); padding: 16px; border-radius: 16px; border: 1px solid var(--border);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 id="form-heading" style="color: var(--accent); font-size: 15px;">录入新知识</h3>
          <button id="btn-cancel-edit" onclick="cancelEditing()" style="display:none; background: #334155; border: none; color: #f87171; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer;">取消编辑</button>
        </div>
        
        <div class="form-group">
          <label>知识点 / 英文生词 / 代码词汇 *</label>
          <input type="text" id="input-word" class="form-control" placeholder="输入单词或短语">
        </div>

        <div class="form-group">
          <label>音标 (IPA)</label>
          <div class="input-with-btn">
            <input type="text" id="input-ipa" class="form-control" placeholder="如: /ˈver.i.ə.bəl/">
            <button type="button" id="btn-fetch-ipa" class="btn-inline-action" onclick="fetchIpaAuto()">⚡ 自动生成音标</button>
          </div>
        </div>

        <div class="form-group">
          <label>中文释义 *</label>
          <div class="input-with-btn">
            <input type="text" id="input-meaning" class="form-control" placeholder="中文释义">
            <button type="button" id="btn-fetch-meaning" class="btn-inline-action" style="background:#059669;" onclick="fetchMeaningAuto()">⚡ 自动生成中文</button>
          </div>
        </div>

        <div class="form-group">
          <label>例句 (用于生成填空与跟读) [选填]</label>
          <textarea id="input-sentence" class="form-control" placeholder="输入包含该词的例句"></textarea>
        </div>

        <div class="form-group">
          <label>🎙️ 录制原声朗读 (专属原声复习题型)</label>
          <div class="recorder-box">
            <span id="record-status-text" style="font-size: 12px; color: var(--text-dim);">未录音</span>
            <div style="display:flex; gap:6px;">
              <button type="button" class="record-btn" id="btn-toggle-record" onclick="toggleRecording()">● 开始录音</button>
              <button type="button" id="btn-preview-record" style="display:none; background:#334155; color:#fff; border:none; padding:6px 10px; border-radius:20px; font-size:12px; cursor:pointer;" onclick="previewRecordedVoice()">▶ 试听</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>分类</label>
          <select id="input-category" class="form-control">
            <option value="English">🗣️ 英语词汇 (English)</option>
            <option value="Code">💻 编程代码 (Coding)</option>
            <option value="AI Movie">🎬 AI 电影制作 (AI Movie)</option>
            <option value="General">📌 通用小知识 (General)</option>
          </select>
        </div>

        <button id="btn-submit-card" class="btn-submit" onclick="saveOrUpdateCard()">💾 保存到艾宾浩斯复习库</button>
      </div>
    </div>

    <!-- 4. AI TUTOR VIEW -->
    <div id="view-ai" class="view-section">
      <div class="ai-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="color: var(--accent); font-size: 15px;">🤖 AI 智能助教</h3>
          <button onclick="toggleApiSettings()" style="background: #26334d; border: none; color: #38bdf8; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer;">⚙️ API 配置</button>
        </div>

        <!-- API 配置面板 -->
        <div id="api-config-panel" style="display: none; background: var(--card-inner); padding: 12px; border-radius: 10px; border: 1px solid var(--border);">
          <div class="form-group">
            <label>API 端点 (Base URL)</label>
            <input type="text" id="llm-base-url" class="form-control" value="https://api.deepseek.com/v1">
          </div>
          <div class="form-group">
            <label>模型名称 (Model)</label>
            <input type="text" id="llm-model" class="form-control" value="deepseek-chat">
          </div>
          <div class="form-group">
            <label>API Key (密钥)</label>
            <input type="password" id="llm-api-key" class="form-control" placeholder="填入国内平台 API Key (DeepSeek / 硅基流动)">
          </div>
          <button type="button" class="btn-submit" style="padding: 8px; font-size: 12px;" onclick="saveApiConfig()">保存配置</button>
        </div>

        <!-- 助教子导航 -->
        <div class="sub-tabs">
          <button class="sub-tab-btn active" id="subtab-ai-ask" onclick="switchAiMode('ask')">💬 查词 / 短语解惑</button>
          <button class="sub-tab-btn" id="subtab-ai-essay" onclick="switchAiMode('essay')">✍️ 作文批改润色</button>
        </div>

        <!-- 模式 1: 查词问答 & 一键入库 -->
        <div id="ai-panel-ask">
          <div class="form-group">
            <textarea id="ai-ask-input" class="form-control" style="min-height: 80px;" placeholder="输入生词、短语、长句或任何疑问 (例如: ephemeral 或 take for granted)..."></textarea>
          </div>
          <button class="btn-submit" style="background:#0284c7;" onclick="askAiForExplanation()">🔍 发送提问 / 深度剖析</button>

          <div id="ai-ask-result-wrapper" style="display: none; margin-top: 14px;">
            <div style="font-size: 12px; color: var(--accent); font-weight: bold; margin-bottom: 6px;">💡 助教解析与学习笔记:</div>
            <div class="ai-chat-output" id="ai-ask-chat-box"></div>
            
            <div id="card-preview-zone" class="card-preview-box" style="display:none;">
              <div class="card-preview-title">📌 提取卡片预览</div>
              <div style="font-size: 14px; font-weight: bold; color: #fff;" id="prev-word"></div>
              <div style="font-size: 12px; color: var(--accent); font-family: monospace;" id="prev-ipa"></div>
              <div style="font-size: 13px; color: #cbd5e1; margin-top: 2px;" id="prev-meaning"></div>
              <div style="font-size: 12px; color: #94a3b8; font-style: italic; margin-top: 2px;" id="prev-sentence"></div>
              
              <button class="btn-submit" style="background:#10b981; margin-top:10px; padding:10px;" onclick="saveAiCardToDeck()">📥 一键加入艾宾浩斯复习库</button>
            </div>
          </div>
        </div>

        <!-- 模式 2: 作文批改 -->
        <div id="ai-panel-essay" style="display: none;">
          <textarea id="essay-input" class="form-control" style="min-height: 120px; font-size: 14px; line-height: 1.5;" placeholder="在此输入需要批改的英文习作短文..."></textarea>
          <button class="btn-submit" style="background:#0284c7;" onclick="runDomesticLlmCheck()">🤖 提交大模型智能批改</button>

          <div id="essay-result-wrapper" style="display: none; margin-top: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <span style="font-size: 12px; font-weight: bold; color: var(--accent);">批改反馈与地道润色:</span>
              <div style="display: flex; gap: 4px;">
                <button class="btn-small" style="background: #8b5cf6;" onclick="sendEssayToTrain('shadow')">🗣️ 练跟读</button>
                <button class="btn-small" style="background: #059669;" onclick="sendEssayToTrain('dict')">🎧 练听写</button>
              </div>
            </div>
            <div class="ai-chat-output" id="essay-result-box"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- 5. LIST VIEW -->
    <div id="view-list" class="view-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 13px; color: var(--text-dim);">知识库 (<span id="total-count-label">0</span>)</span>
        
        <div style="display: flex; gap: 6px;">
          <input type="file" id="file-import-input" accept=".json" style="display: none;" onchange="handleFileImport(event)">
          <button onclick="triggerImport()" style="background: #1e293b; border: 1px solid var(--border); color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600;">📥 导入数据</button>
          <button onclick="exportData()" style="background: #1e293b; border: 1px solid var(--border); color: #a5f3fc; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600;">📤 备份数据</button>
        </div>
      </div>
      <div class="card-list" id="card-list-container"></div>
    </div>
  </div>

  <script>
    const SPACING_DAYS = [0, 1, 4, 18, 90];

    const DEFAULT_DATA = [
      {
        id: "d1",
        word: "Variable",
        ipa: "/ˈver.i.ə.bəl/",
        meaning: "变量 (用于在内存中存储数据的容器)",
        category: "Code",
        sentence: "A variable stores data inside the computer memory.",
        userAudio: null,
        streak: 0,
        nextReviewTime: Date.now() - 1000
      }
    ];

    let cards = [];
    let currentQuizCard = null;
    let currentQuizType = "";
    let editingCardId = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let recordedBase64 = null;
    let isRecording = false;

    let speechRecognizer = null;
    let isRecognizing = false;

    let pendingAiCard = null;

    function initData() {
      const saved = localStorage.getItem("ebbinghaus_v6_cards") || localStorage.getItem("ebbinghaus_v5_cards") || localStorage.getItem("ebbinghaus_v4_cards");
      if (saved) {
        try { cards = JSON.parse(saved); } catch(e) { cards = DEFAULT_DATA; }
      } else {
        cards = DEFAULT_DATA;
        saveToStorage();
      }

      document.getElementById('llm-base-url').value = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
      document.getElementById('llm-model').value = localStorage.getItem('llm_model') || 'deepseek-chat';
      document.getElementById('llm-api-key').value = localStorage.getItem('llm_api_key') || '';

      updateDueCounter();
      pickNextCard();
      renderCardList();
      
      // 启动时自动拉取今日科技短讯
      loadDailyNews();
    }

    function saveToStorage() {
      localStorage.setItem("ebbinghaus_v6_cards", JSON.stringify(cards));
      updateDueCounter();
    }

    function switchTab(tabId) {
      const tabs = ['review', 'train', 'add', 'ai', 'list'];
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.remove('active');
        if (tabs[i] === tabId) b.classList.add('active');
      });
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(`view-${tabId}`).classList.add('active');
      if (tabId === 'review') pickNextCard();
      if (tabId === 'list') renderCardList();
    }

    function switchAiMode(mode) {
      document.getElementById('subtab-ai-ask').classList.toggle('active', mode === 'ask');
      document.getElementById('subtab-ai-essay').classList.toggle('active', mode === 'essay');
      document.getElementById('ai-panel-ask').style.display = mode === 'ask' ? 'block' : 'none';
      document.getElementById('ai-panel-essay').style.display = mode === 'essay' ? 'block' : 'none';
    }

    function switchTrainMode(mode) {
      document.getElementById('subtab-btn-shadow').classList.toggle('active', mode === 'shadow');
      document.getElementById('subtab-btn-dict').classList.toggle('active', mode === 'dict');
      document.getElementById('train-mode-shadow').style.display = mode === 'shadow' ? 'block' : 'none';
      document.getElementById('train-mode-dict').style.display = mode === 'dict' ? 'block' : 'none';
    }

    function updateDueCounter() {
      const now = Date.now();
      const dueCount = cards.filter(c => c.nextReviewTime <= now).length;
      document.getElementById('nav-due-counter').innerText = `待复习: ${dueCount}`;
      document.getElementById('total-count-label').innerText = cards.length;
    }

    function pickNextCard() {
      const now = Date.now();
      const dueCards = cards.filter(c => c.nextReviewTime <= now);
      const quizBox = document.getElementById('quiz-card-box');
      
      if (dueCards.length === 0) {
        quizBox.innerHTML = `
          <div class="empty-state">
            <h3 style="color: #38bdf8; font-size: 18px;">🎉 今日复习已清空！</h3>
            <p style="margin-top: 8px;">卡片已根据艾宾浩斯曲线全部排期完成。</p>
          </div>
        `;
        return;
      }

      currentQuizCard = dueCards[Math.floor(Math.random() * dueCards.length)];

      const availableTypes = ['word_to_meaning', 'meaning_to_word'];
      if (currentQuizCard.ipa && currentQuizCard.ipa.trim() !== '') availableTypes.push('ipa_to_word');
      if (currentQuizCard.sentence && currentQuizCard.sentence.trim() !== '') availableTypes.push('cloze');
      if (currentQuizCard.userAudio) availableTypes.push('user_audio_to_word');

      currentQuizType = availableTypes[Math.floor(Math.random() * availableTypes.length)];

      document.getElementById('answer-box').style.display = 'none';
      document.getElementById('action-btns').style.display = 'none';
      document.getElementById('btn-reveal').style.display = 'block';
      document.getElementById('q-sentence-box').style.display = 'none';
      document.getElementById('btn-audio-sys').style.display = 'none';
      document.getElementById('btn-audio-user').style.display = currentQuizCard.userAudio ? 'inline-flex' : 'none';

      document.getElementById('q-streak-label').innerText = `连胜: 🔥 ${currentQuizCard.streak}`;

      if (currentQuizType === 'word_to_meaning') {
        document.getElementById('q-mode-label').innerText = '🔤 看生词 → 回忆释义';
        document.getElementById('q-main-text').innerText = currentQuizCard.word;
        document.getElementById('q-sub-text').innerText = `分类: ${currentQuizCard.category}`;
        document.getElementById('btn-audio-sys').style.display = 'inline-flex';
      } 
      else if (currentQuizType === 'meaning_to_word') {
        document.getElementById('q-mode-label').innerText = '🇨🇳 看释义 → 回忆英文/代码';
        document.getElementById('q-main-text').innerText = currentQuizCard.meaning;
        document.getElementById('q-sub-text').innerText = `分类: ${currentQuizCard.category}`;
      } 
      else if (currentQuizType === 'ipa_to_word') {
        document.getElementById('q-mode-label').innerText = '🗣️ 看音标 → 回忆词汇';
        document.getElementById('q-main-text').innerText = currentQuizCard.ipa;
        document.getElementById('q-sub-text').innerText = `分类: ${currentQuizCard.category}`;
        document.getElementById('btn-audio-sys').style.display = 'inline-flex';
      } 
      else if (currentQuizType === 'user_audio_to_word') {
        document.getElementById('q-mode-label').innerText = '🎙️ 听原声 → 回忆单词';
        document.getElementById('q-main-text').innerText = "🎧 点击下方播放原声";
        document.getElementById('q-sub-text').innerText = `分类: ${currentQuizCard.category}`;
        playUserAudio();
      } 
      else if (currentQuizType === 'cloze') {
        document.getElementById('q-mode-label').innerText = '🧩 例句填空题';
        document.getElementById('q-main-text').innerText = "填入挖空词汇:";
        document.getElementById('q-sub-text').innerText = `释义提示: ${currentQuizCard.meaning}`;
        const regex = new RegExp(currentQuizCard.word, "gi");
        const blankedSentence = currentQuizCard.sentence.replace(regex, " [ ______ ] ");
        const sBox = document.getElementById('q-sentence-box');
        sBox.innerHTML = blankedSentence;
        sBox.style.display = 'block';
      }

      document.getElementById('ans-title').innerText = currentQuizCard.word;
      document.getElementById('ans-ipa').innerText = currentQuizCard.ipa || '';
      document.getElementById('ans-meaning').innerText = currentQuizCard.meaning;
      document.getElementById('ans-sentence').innerText = currentQuizCard.sentence ? `例句: ${currentQuizCard.sentence}` : '';
    }

    function revealAnswer() {
      document.getElementById('answer-box').style.display = 'block';
      document.getElementById('btn-reveal').style.display = 'none';
      document.getElementById('action-btns').style.display = 'grid';
      document.getElementById('btn-audio-sys').style.display = 'inline-flex';
      playCurrentAudio();
    }

    function handleResult(isCorrect) {
      if (!currentQuizCard) return;

      if (isCorrect) {
        currentQuizCard.streak += 1;
        let stage = Math.min(currentQuizCard.streak, SPACING_DAYS.length - 1);
        let days = SPACING_DAYS[stage];
        if (days >= 90) {
          const jitter = Math.floor(Math.random() * 21) - 10;
          days += jitter;
        }
        currentQuizCard.nextReviewTime = Date.now() + days * 24 * 60 * 60 * 1000;
      } else {
        currentQuizCard.streak = 0;
        currentQuizCard.nextReviewTime = Date.now() + 10 * 60 * 1000;
      }

      saveToStorage();
      pickNextCard();
    }

    function playAudioStream(text, rate = 1.0) {
      if (!text || !text.trim()) return;
      const clean = text.trim();

      if (!clean.includes(' ') && clean.length < 30) {
        const audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(clean)}&type=2`;
        const audio = new Audio(audioUrl);
        audio.playbackRate = rate;
        audio.play().catch(e => speakWithTTS(clean, rate));
      } else {
        speakWithTTS(clean, rate);
      }
    }

    function speakWithTTS(text, rate = 1.0) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = rate;
        window.speechSynthesis.speak(utterance);
      }
    }

    function playCurrentAudio() {
      if (currentQuizCard && currentQuizCard.word) {
        playAudioStream(currentQuizCard.word, 1.0);
      }
    }

    function playUserAudio() {
      if (currentQuizCard && currentQuizCard.userAudio) new Audio(currentQuizCard.userAudio).play();
    }

    /* 跟读打分逻辑 */
    function toggleShadowRecognition() {
      const targetText = document.getElementById('train-target-text').value.trim();
      const status = document.getElementById('shadow-status');
      const btn = document.getElementById('btn-start-shadow');

      if (!targetText) {
        alert("请先输入或从下方导入要跟读的内容！");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("当前环境未开放 Web Speech API 接口，请使用 Chrome 或在 HTTPS 环境下运行。");
        return;
      }

      if (!isRecognizing) {
        speechRecognizer = new SpeechRecognition();
        speechRecognizer.lang = 'en-US';
        speechRecognizer.continuous = false;
        speechRecognizer.interimResults = false;

        speechRecognizer.onstart = () => {
          isRecognizing = true;
          btn.innerText = "■ 正在倾听，请大声朗读...";
          btn.style.background = "#ef4444";
          status.innerText = "🎙️ 正在录入发音，读完请稍停片刻...";
        };

        speechRecognizer.onresult = (event) => {
          const spoken = event.results[0][0].transcript;
          gradePronunciation(targetText, spoken);
        };

        speechRecognizer.onerror = (event) => {
          status.innerText = `⚠️ 识别未成功 (${event.error})，请靠近麦克风重试。`;
          resetShadowBtn();
        };

        speechRecognizer.onend = () => {
          resetShadowBtn();
        };

        try {
          speechRecognizer.start();
        } catch (e) {
          alert("麦克风启动失败: " + e.message);
          resetShadowBtn();
        }
      } else {
        if (speechRecognizer) speechRecognizer.stop();
        resetShadowBtn();
      }
    }

    function resetShadowBtn() {
      isRecognizing = false;
      const btn = document.getElementById('btn-start-shadow');
      btn.innerText = "🎙️ 点击开始跟读识别";
      btn.style.background = "#8b5cf6";
    }

    function gradePronunciation(target, spoken) {
      const cleanTargetWords = target.toLowerCase().replace(/[^a-z0-9\s']/g, '').split(/\s+/).filter(Boolean);
      const cleanSpokenWords = spoken.toLowerCase().replace(/[^a-z0-9\s']/g, '').split(/\s+/).filter(Boolean);

      let matchedCount = 0;
      let diffHtml = "";

      cleanTargetWords.forEach((word) => {
        if (cleanSpokenWords.includes(word)) {
          matchedCount++;
          diffHtml += `<span class="diff-word-correct">${word}</span> `;
        } else {
          diffHtml += `<span class="diff-word-wrong">${word}</span> `;
        }
      });

      const score = Math.round((matchedCount / Math.max(cleanTargetWords.length, 1)) * 100);

      document.getElementById('shadow-result-panel').style.display = 'block';
      document.getElementById('shadow-score-num').innerText = score;
      document.getElementById('shadow-diff-box').innerHTML = `
        <div><b>原文对比:</b> ${diffHtml}</div>
        <div style="margin-top:6px; color:#94a3b8; font-size:12px;"><b>你读到的内容:</b> "${spoken}"</div>
      `;

      const desc = document.getElementById('shadow-score-desc');
      if (score >= 90) { desc.innerText = "🌟 绝妙发音！几乎与原声一致！"; desc.style.color = "#34d399"; }
      else if (score >= 70) { desc.innerText = "👍 表现良好！请注意红色高亮词的发音重音。"; desc.style.color = "#38bdf8"; }
      else { desc.innerText = "💪 继续加油！尝试调慢语速(0.8x)逐词跟读。"; desc.style.color = "#f59e0b"; }
    }

    /* 听写检测 */
    function gradeDictation() {
      const target = document.getElementById('train-target-text').value.trim();
      const userTyped = document.getElementById('dictation-user-input').value.trim();

      if (!target) { alert("请先设置听写原文！"); return; }
      if (!userTyped) { alert("请在文本框输入你听到的内容！"); return; }

      const targetTokens = target.toLowerCase().replace(/[^a-z0-9\s']/g, '').split(/\s+/).filter(Boolean);
      const typedTokens = userTyped.toLowerCase().replace(/[^a-z0-9\s']/g, '').split(/\s+/).filter(Boolean);

      let correctCount = 0;
      let resultHtml = "";

      targetTokens.forEach((word, idx) => {
        const userWord = typedTokens[idx] || "";
        if (word === userWord) {
          correctCount++;
          resultHtml += `<span class="diff-word-correct">${word}</span> `;
        } else {
          resultHtml += `<span class="diff-word-wrong">${userWord || '[缺]'}</span><span class="diff-word-missing">(${word})</span> `;
        }
      });

      const accuracy = Math.round((correctCount / Math.max(targetTokens.length, 1)) * 100);

      document.getElementById('dict-result-panel').style.display = 'block';
      document.getElementById('dict-score-num').innerText = `${accuracy}%`;
      document.getElementById('dict-diff-box').innerHTML = `
        <div><b>逐词批改 (绿色为对，红色为你的拼写，括号内为正解):</b></div>
        <div style="margin-top:6px;">${resultHtml}</div>
      `;
    }

    async function toggleRecording() {
      const btn = document.getElementById('btn-toggle-record');
      const statusText = document.getElementById('record-status-text');

      if (!isRecording) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("麦克风未授权或当前处于非安全网络环境中。");
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              recordedBase64 = reader.result;
              statusText.innerText = "✅ 录音已保存";
              document.getElementById('btn-preview-record').style.display = 'inline-block';
            };
          };

          mediaRecorder.start();
          isRecording = true;
          btn.innerText = "■ 停止";
          btn.classList.add('recording');
          statusText.innerText = "🎙️ 录音中...";
        } catch (err) {
          alert("录音启动失败: " + err.message);
        }
      } else {
        if (mediaRecorder) mediaRecorder.stop();
        isRecording = false;
        btn.innerText = "● 重新录音";
        btn.classList.remove('recording');
      }
    }

    function previewRecordedVoice() {
      if (recordedBase64) new Audio(recordedBase64).play();
    }

    async function fetchIpaAuto() {
      const word = document.getElementById('input-word').value.trim();
      const ipaInput = document.getElementById('input-ipa');
      const btn = document.getElementById('btn-fetch-ipa');

      if (!word) { alert("请先输入英文单词！"); return; }
      btn.innerText = "⏳ 查询中...";

      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        const data = await res.json();
        let phonetic = data[0]?.phonetic || data[0]?.phonetics?.find(p => p.text)?.text;
        if (phonetic) {
          ipaInput.value = phonetic;
          btn.innerText = "⚡ 自动生成音标";
          return;
        }
      } catch (e) {}

      const apiKey = localStorage.getItem('llm_api_key');
      if (apiKey) {
        try {
          const baseUrl = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
          const model = localStorage.getItem('llm_model') || 'deepseek-chat';
          const resp = await fetch(`${baseUrl.replace(/\/+$/, '')}/chat/completions`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
            body: JSON.stringify({
              model: model,
              messages: [{ role: "user", content: `请只输出英文单词 "${word}" 的国际音标，必须用斜杠包裹如 /.../，不要有任何多余文字。` }],
              temperature: 0.1
            })
          });
          const d = await resp.json();
          const matchIpa = d.choices?.[0]?.message?.content?.match(/\/.*?\/|\[.*?\]/);
          if (matchIpa) {
            ipaInput.value = matchIpa[0];
            btn.innerText = "⚡ 自动生成音标";
            return;
          }
        } catch (err) {}
      }

      btn.innerText = "⚡ 自动生成音标";
      alert("未能自动获取，请手动输入或配置 API Key。");
    }

    async function fetchMeaningAuto() {
      const word = document.getElementById('input-word').value.trim();
      const meaningInput = document.getElementById('input-meaning');
      const btn = document.getElementById('btn-fetch-meaning');

      if (!word) { alert("请先输入单词！"); return; }
      btn.innerText = "⏳ 查询中...";

      try {
        const res = await fetch(`https://dict.youdao.com/suggest?num=1&doctype=json&q=${encodeURIComponent(word)}`);
        const data = await res.json();
        if (data?.data?.entries?.[0]?.explain) {
          meaningInput.value = data.data.entries[0].explain;
          btn.innerText = "⚡ 自动生成中文";
          return;
        }
      } catch (e) {}

      const apiKey = localStorage.getItem('llm_api_key');
      if (apiKey) {
        try {
          const baseUrl = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
          const model = localStorage.getItem('llm_model') || 'deepseek-chat';
          const resp = await fetch(`${baseUrl.replace(/\/+$/, '')}/chat/completions`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
            body: JSON.stringify({
              model: model,
              messages: [{ role: "user", content: `请给出单词或短语 "${word}" 准确精炼的中文释义（包含词性），不要多余废话。` }],
              temperature: 0.1
            })
          });
          const d = await resp.json();
          const reply = d.choices?.[0]?.message?.content?.trim();
          if (reply) {
            meaningInput.value = reply;
            btn.innerText = "⚡ 自动生成中文";
            return;
          }
        } catch (err) {}
      }

      btn.innerText = "⚡ 自动生成中文";
      alert("中文释义自动获取失败，请手动输入。");
    }

    function saveOrUpdateCard() {
      const word = document.getElementById('input-word').value.trim();
      const ipa = document.getElementById('input-ipa').value.trim();
      const meaning = document.getElementById('input-meaning').value.trim();
      const sentence = document.getElementById('input-sentence').value.trim();
      const category = document.getElementById('input-category').value;

      if (!word || !meaning) {
        alert("请至少填写【单词/代码】与【中文释义】！");
        return;
      }

      if (editingCardId) {
        const card = cards.find(c => c.id === editingCardId);
        if (card) {
          card.word = word;
          card.ipa = ipa;
          card.meaning = meaning;
          card.sentence = sentence;
          card.category = category;
          if (recordedBase64) card.userAudio = recordedBase64;
        }
        alert("✅ 修改已保存！");
        cancelEditing();
      } else {
        const newCard = {
          id: "card_" + Date.now(),
          word,
          ipa,
          meaning,
          sentence,
          category,
          userAudio: recordedBase64 || null,
          streak: 0,
          nextReviewTime: Date.now() - 1000
        };
        cards.unshift(newCard);
        alert("🎉 录入成功！");
      }

      saveToStorage();
      resetForm();
      switchTab('list');
    }

    function startEditCard(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      editingCardId = card.id;

      document.getElementById('input-word').value = card.word;
      document.getElementById('input-ipa').value = card.ipa || '';
      document.getElementById('input-meaning').value = card.meaning;
      document.getElementById('input-sentence').value = card.sentence || '';
      document.getElementById('input-category').value = card.category;

      recordedBase64 = card.userAudio || null;
      if (recordedBase64) {
        document.getElementById('record-status-text').innerText = "✅ 现有原声可用";
        document.getElementById('btn-preview-record').style.display = 'inline-block';
      } else {
        document.getElementById('record-status-text').innerText = "未录音";
        document.getElementById('btn-preview-record').style.display = 'none';
      }

      document.getElementById('form-heading').innerText = `✏️ 正在编辑: ${card.word}`;
      document.getElementById('btn-cancel-edit').style.display = 'inline-block';
      document.getElementById('btn-submit-card').innerText = "💾 保存修改并更新";

      switchTab('add');
    }

    function cancelEditing() {
      editingCardId = null;
      document.getElementById('form-heading').innerText = "录入新知识";
      document.getElementById('btn-cancel-edit').style.display = 'none';
      document.getElementById('btn-submit-card').innerText = "💾 保存到艾宾浩斯复习库";
      resetForm();
      switchTab('list');
    }

    function deleteCard(cardId) {
      if (confirm("确定要删除这个知识点吗？")) {
        cards = cards.filter(c => c.id !== cardId);
        saveToStorage();
        renderCardList();
      }
    }

    function sendToTrain(text, mode = 'shadow') {
      if (!text) return;
      document.getElementById('train-target-text').value = text;
      switchTab('train');
      switchTrainMode(mode);
    }

    function sendEssayToTrain(mode) {
      const essayResult = document.getElementById('essay-result-box').innerText;
      if (!essayResult) {
        alert("暂无批改结果！");
        return;
      }
      sendToTrain(essayResult, mode);
    }

    function resetForm() {
      document.getElementById('input-word').value = "";
      document.getElementById('input-ipa').value = "";
      document.getElementById('input-meaning').value = "";
      document.getElementById('input-sentence').value = "";
      recordedBase64 = null;
      document.getElementById('record-status-text').innerText = "未录音";
      document.getElementById('btn-preview-record').style.display = 'none';
    }

    function renderCardList() {
      const container = document.getElementById('card-list-container');
      if (cards.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无卡片</div>';
        return;
      }
      container.innerHTML = cards.map(c => {
        const isMaster = c.streak >= 3;
        const badgeClass = isMaster ? 'badge-master' : 'badge-learning';
        const badgeText = isMaster ? `初步掌握 (🔥${c.streak})` : `记忆中 (🔥${c.streak})`;
        const audioIcon = c.userAudio ? ' 🎙️' : '';
        const trainTarget = c.sentence ? c.sentence : c.word;
        return `
          <div class="item-card">
            <div class="item-header">
              <div>
                <span class="item-word">${c.word}</span>
                <span class="item-ipa">${c.ipa || ''}</span>${audioIcon}
              </div>
              <span class="item-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="item-meaning">${c.meaning}</div>
            ${c.sentence ? `<div style="font-size:12px; color:#94a3b8; font-style:italic;">例: ${c.sentence}</div>` : ''}
            <div class="item-actions">
              <button class="btn-small" onclick="sendToTrain('${c.word}', 'shadow')">🗣️ 练单词</button>
              ${c.sentence ? `<button class="btn-small" onclick="sendToTrain('${c.sentence.replace(/'/g, "\\'")}', 'shadow')">🗣️ 练例句</button>` : ''}
              <button class="btn-small" onclick="sendToTrain('${trainTarget.replace(/'/g, "\\'")}', 'dict')">🎧 练听写</button>
              <button class="btn-small" style="color:#38bdf8;" onclick="startEditCard('${c.id}')">✏️ 修改</button>
              <button class="btn-small" style="color:#f87171;" onclick="deleteCard('${c.id}')">🗑️ 删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleApiSettings() {
      const p = document.getElementById('api-config-panel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    function saveApiConfig() {
      localStorage.setItem('llm_base_url', document.getElementById('llm-base-url').value.trim());
      localStorage.setItem('llm_model', document.getElementById('llm-model').value.trim());
      localStorage.setItem('llm_api_key', document.getElementById('llm-api-key').value.trim());
      alert("✅ 大模型 API 配置已保存！");
      toggleApiSettings();
    }

    /* 助教查词答疑与一键入库 */
    async function askAiForExplanation() {
      const query = document.getElementById('ai-ask-input').value.trim();
      const apiKey = localStorage.getItem('llm_api_key');
      const baseUrl = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
      const model = localStorage.getItem('llm_model') || 'deepseek-chat';

      const resultWrapper = document.getElementById('ai-ask-result-wrapper');
      const chatBox = document.getElementById('ai-ask-chat-box');
      const previewZone = document.getElementById('card-preview-zone');

      if (!query) { alert("请先输入要提问或查询的内容！"); return; }
      if (!apiKey) { alert("请先点击右上角【⚙️ API 配置】填入 API Key！"); toggleApiSettings(); return; }

      resultWrapper.style.display = 'block';
      previewZone.style.display = 'none';
      chatBox.innerText = "🤖 助教正在分析解析词汇与用法...";

      const systemPrompt = `你是一位精通双语教学的名师。用户会输入一个单词、词组、习语或句子。
请按以下规范输出：
1. 给出标准音标(/IPA/)、核心中文释义与词性。
2. 给出地道实用的原比例句与翻译。
3. 讲解核心用法、搭配辨析或词根记忆法。
4. 【极其重要】：在回答的最末尾，另起一行输出一段且仅有一段被 <<<JSON 和 JSON>>> 包裹的卡片数据，格式必须严格如下：
<<<JSON
{
  "word": "提取的目标词汇或短语",
  "ipa": "/音标/",
  "meaning": "核心中文释义",
  "sentence": "刚才生成的最地道例句"
}
JSON>>>
确保内容生动、精简且专业。`;

      try {
        const response = await fetch(`${baseUrl.replace(/\/+$/, '')}/chat/completions`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: query }
            ],
            temperature: 0.3
          })
        });

        const data = await response.json();
        if (data.choices && data.choices[0]) {
          const rawContent = data.choices[0].message.content;
          
          const jsonMatch = rawContent.match(/<<<JSON([\s\S]*?)JSON>>>/);
          let cleanDisplay = rawContent.replace(/<<<JSON[\s\S]*?JSON>>>/, '').trim();
          chatBox.innerText = cleanDisplay;

          if (jsonMatch && jsonMatch[1]) {
            try {
              pendingAiCard = JSON.parse(jsonMatch[1].trim());
              document.getElementById('prev-word').innerText = pendingAiCard.word || query;
              document.getElementById('prev-ipa').innerText = pendingAiCard.ipa || '';
              document.getElementById('prev-meaning').innerText = pendingAiCard.meaning || '';
              document.getElementById('prev-sentence').innerText = pendingAiCard.sentence ? `例: ${pendingAiCard.sentence}` : '';
              previewZone.style.display = 'block';
            } catch(e) {
              previewZone.style.display = 'none';
            }
          }
        } else if (data.error) {
          chatBox.innerText = `❌ API 报错: ${data.error.message}`;
        }
      } catch (err) {
        chatBox.innerText = `❌ 请求失败: ${err.message}`;
      }
    }

    function saveAiCardToDeck() {
      if (!pendingAiCard) return;

      const exists = cards.some(c => c.word.toLowerCase() === pendingAiCard.word.toLowerCase());
      if (exists) {
        if (!confirm(`词库中已存在 "${pendingAiCard.word}"，是否仍要重复加入？`)) return;
      }

      const newCard = {
        id: "card_" + Date.now(),
        word: pendingAiCard.word,
        ipa: pendingAiCard.ipa || '',
        meaning: pendingAiCard.meaning || '',
        sentence: pendingAiCard.sentence || '',
        category: "English",
        userAudio: null,
        streak: 0,
        nextReviewTime: Date.now() - 1000
      };

      cards.unshift(newCard);
      saveToStorage();
      alert(`🎉 成功加入生词库！已为您自动安排艾宾浩斯复习。`);
      document.getElementById('card-preview-zone').style.display = 'none';
    }

    async function runDomesticLlmCheck() {
      const text = document.getElementById('essay-input').value.trim();
      const apiKey = localStorage.getItem('llm_api_key');
      const baseUrl = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
      const model = localStorage.getItem('llm_model') || 'deepseek-chat';

      const resultWrapper = document.getElementById('essay-result-wrapper');
      const resultBox = document.getElementById('essay-result-box');

      if (!text) { alert("请先输入需要批改的内容！"); return; }
      if (!apiKey) { alert("请先点击右上角【⚙️ API 配置】填入 API Key！"); toggleApiSettings(); return; }

      resultWrapper.style.display = 'block';
      resultBox.innerText = "🤖 正在连接大模型进行语法诊断与地道润色...";

      try {
        const response = await fetch(`${baseUrl.replace(/\/+$/, '')}/chat/completions`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: [
              {
                role: "system",
                content: "你是一位双语教学名师。请批改用户的英文习作：1. 诊断拼写、时态和主谓一致错误；2. 标注难词的音标(/IPA/)与释义；3. 给出地道润色版示范短文(供用户跟读练习)；4. 条理清晰。"
              },
              { role: "user", content: text }
            ],
            temperature: 0.3
          })
        });

        const data = await response.json();
        if (data.choices && data.choices[0]) {
          resultBox.innerText = data.choices[0].message.content;
        } else if (data.error) {
          resultBox.innerText = `❌ API 报错: ${data.error.message}`;
        }
      } catch (err) {
        resultBox.innerText = `❌ 请求失败: ${err.message}`;
      }
    }

    /* 每日科技短讯抓取与渲染逻辑 */
    async function loadDailyNews() {
      const container = document.getElementById('news-container');
      if (!container) return;
      container.innerHTML = `<div style="font-size:12px; color:var(--text-dim); text-align:center; padding:10px;">🔄 正在读取今日科技精选...</div>`;

      try {
        const res = await fetch(`./news.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("news.json 尚在生成中");
        
        const data = await res.json();
        if (!data.articles || data.articles.length === 0) {
          container.innerHTML = `<div style="font-size:12px; color:var(--text-dim); text-align:center; padding:10px;">今日暂无短讯推送</div>`;
          return;
        }

        container.innerHTML = data.articles.map(art => {
          const safeText = art.summary.replace(/'/g, "\\'").replace(/"/g, '&quot;');
          return `
            <div class="item-card" style="margin-bottom:10px;">
              <div style="font-weight:bold; color:#38bdf8; font-size:14px; line-height:1.4;">${art.title}</div>
              <div style="font-size:13px; color:#cbd5e1; margin:6px 0; line-height:1.5;">${art.summary}</div>
              <div class="item-actions">
                <button class="btn-small" onclick="sendToTrain('${safeText}', 'shadow')">🗣️ 练这段跟读</button>
                <button class="btn-small" onclick="sendToTrain('${safeText}', 'dict')">🎧 练这段听写</button>
                ${art.url ? `<a href="${art.url}" target="_blank" style="font-size:11px; color:#94a3b8; text-decoration:none; padding:4px 6px; display:inline-flex; align-items:center;">🔗 原文</a>` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `
          <div style="font-size:12px; color:var(--text-dim); text-align:center; padding:12px; border:1px dashed var(--border); border-radius:10px;">
            📰 每日科技短讯等待 GitHub Action 首次生成中...<br>
            <span style="font-size:11px; color:#64748b; margin-top:4px; display:block;">(Action 任务每天清晨自动更新 news.json)</span>
          </div>
        `;
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cards, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `memorize_backup_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      const input = document.getElementById('file-import-input');
      input.value = '';
      input.click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) {
            alert("导入失败：文件格式不符合要求（必须是卡片列表 JSON 文件）");
            return;
          }

          const validCards = imported.filter(item => item && item.word && item.meaning);
          if (validCards.length === 0) {
            alert("未发现有效词卡数据！");
            return;
          }

          const isMerge = confirm(`检测到 ${validCards.length} 条有效词卡！\n\n点击【确定】：【追加合并】(保留当前已有数据，自动跳过重复词)\n点击【取消】：【完全覆盖】(清空当前数据，仅保留导入内容)`);

          if (isMerge) {
            let addedCount = 0;
            const existingWords = new Set(cards.map(c => c.word.trim().toLowerCase()));
            validCards.forEach(c => {
              if (!existingWords.has(c.word.trim().toLowerCase())) {
                cards.push(c);
                existingWords.add(c.word.trim().toLowerCase());
                addedCount++;
              }
            });
            alert(`✅ 合并完成！新增导入 ${addedCount} 张卡片（重复词已自动跳过）。`);
          } else {
            cards = validCards;
            alert(`✅ 覆盖完成！当前词库已替换为 ${cards.length} 张卡片。`);
          }

          saveToStorage();
          renderCardList();
          pickNextCard();
        } catch (err) {
          alert("解析文件失败，请确保上传的是有效的 JSON 备份文件: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    initData();
  </script>
